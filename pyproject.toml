[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fun_ds"
dynamic = ["version"]
description = "Illustrative library for Fundamentals of Data Science (MPhil EDS, Cambridge)"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.11"
authors = [
    { name = "Adrian Ochs" },
    { name = "Christian Roerig" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.urls]
Documentation = "https://cambridge-fds.github.io/fun_ds"
Repository = "https://github.com/cambridge-FDS/fun_ds"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fun_ds"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "D", "B", "C4"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["fun_ds"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]
# Teaching notebooks: skip docstring conventions, line-length, and bare display
# expressions (e.g. a trailing `df.head()` cell). Real errors are still caught.
"docs/lectures/*.ipynb" = ["D101", "D102", "D103", "D105", "D401", "E501", "B018"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=fun_ds"
testpaths = ["tests"]
