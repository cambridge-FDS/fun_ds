name: Publish docs

# On every push to main: build the Jupyter Book and publish it to GitHub Pages
# (via the Actions artifact — no gh-pages branch needed). Lint and tests run on the
# PR beforehand (see ci.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      # Project site is served under /fun_ds/, so MyST must build with that prefix.
      - name: Build docs
        env:
          BASE_URL: /fun_ds
        run: pixi run docs-build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
