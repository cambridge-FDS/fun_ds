name: Preview docs

# Build the docs for a pull request and publish them to a per-PR subfolder on the
# gh-pages branch (/pr-preview/pr-<N>/). A bot comments the live URL on the PR and
# removes the preview when the PR is closed or merged.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - docs/**

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only build when the PR is being opened/updated, not when it is closed
      # (on close the deploy action just needs to remove the old preview).
      - name: Set up pixi
        if: github.event.action != 'closed'
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: docs
          cache: true

      # Preview is served at /fun_ds/pr-preview/pr-<N>/, so MyST needs the full prefix.
      - name: Build docs
        if: github.event.action != 'closed'
        env:
          BASE_URL: /fun_ds/pr-preview/pr-${{ github.event.number }}
        run: pixi run -e docs docs-build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/_build/html
          preview-branch: gh-pages
          umbrella-dir: pr-preview
