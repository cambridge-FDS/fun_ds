name: Publish docs

# Build the Jupyter Book and publish it to the gh-pages branch on every push to
# main. GitHub Pages must be configured to serve from the gh-pages branch (root),
# which is also where PR previews live under /pr-preview/ (see docs-preview.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys to gh-pages race each other.
concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: docs
          cache: true

      # Project site is served under /fun_ds/, so MyST must build with that prefix.
      - name: Build docs
        env:
          BASE_URL: /fun_ds
        run: pixi run -e docs docs-build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/_build/html
          # Keep the pr-preview/ subfolders that live alongside the main site.
          clean-exclude: pr-preview/
